name: Release (deterministic, tag-triggered)

# Publishes constitutional-agent to PyPI from an annotated version tag. The build
# is reproducible on the pinned Ubuntu/Linux release platform and toolchain: the
# artifact validated by this workflow and the artifact published are the same
# bytes — there is NO rebuild between validation and upload. Publication requires
# manual approval via the protected `pypi` environment, which only enforces
# approval once REQUIRED REVIEWERS are configured on that environment in repo
# settings AND PyPI Trusted Publishing is set for this repo/workflow/environment;
# verify both before tagging (see docs/release/RELEASE_RUNBOOK.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish (e.g. v0.7.0)"
        required: true

permissions:
  contents: read

env:
  # Keep in lock-step with release-validation.yml so both use the identical pinned
  # toolchain. Determinism is per-commit on the pinned Ubuntu/Linux platform (the
  # validated artifact and the published artifact are the same bytes; a rebuild on
  # the same platform/toolchain from the same commit reproduces them).
  BUILD_PINS: "build==1.5.0 setuptools==83.0.0 wheel==0.47.0 twine==6.2.0"

jobs:
  build:
    name: Deterministic build from tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exact, annotated release tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.ref }}"
          else
            case "${GITHUB_REF}" in
              refs/tags/*) REF="${GITHUB_REF#refs/tags/}" ;;
              *) echo "::error::release.yml must be triggered by a tag; got ${GITHUB_REF}"; exit 1 ;;
            esac
          fi
          # 1) exact vX.Y.Z form — reject branches, raw SHAs, prereleases, junk
          echo "$REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::'$REF' is not a release tag of the form vX.Y.Z"; exit 1; }
          # 2) tag must equal the packaged version
          VER="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "$REF" = "v${VER}" ] \
            || { echo "::error::tag '$REF' != package version 'v${VER}'"; exit 1; }
          # 3) must be an ANNOTATED tag (lightweight tags are rejected)
          TYPE="$(git cat-file -t "$REF" 2>/dev/null || true)"
          [ "$TYPE" = "tag" ] \
            || { echo "::error::'$REF' is not an annotated tag (type='${TYPE:-missing}')"; exit 1; }
          # 4) checked-out commit must be exactly the commit the tag points to
          TAG_COMMIT="$(git rev-list -n1 "$REF")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          [ "$TAG_COMMIT" = "$HEAD_COMMIT" ] \
            || { echo "::error::HEAD ($HEAD_COMMIT) is not the tagged commit ($TAG_COMMIT)"; exit 1; }
          echo "Verified annotated release tag $REF at $TAG_COMMIT (== v${VER})"

      - name: Pin build toolchain
        run: pip install ${{ env.BUILD_PINS }}

      - name: Guard — CHANGELOG must carry a real release date (not UNRELEASED)
        run: |
          if grep -qiE '^\#\#\s*\[0\.7\.0\]\s*-\s*UNRELEASED' CHANGELOG.md; then
            echo "::error::CHANGELOG still marks 0.7.0 as UNRELEASED. Set the release date on the tagged commit before releasing."
            exit 1
          fi

      - name: Deterministic double-build + normalize + compare
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH (tagged commit)"
          for n in a b; do
            rm -rf "/tmp/build-$n"; mkdir -p "/tmp/build-$n"
            git archive HEAD | tar -x -C "/tmp/build-$n"
            ( cd "/tmp/build-$n"
              python -m build --no-isolation
              python "$GITHUB_WORKSPACE/scripts/normalize_sdist.py" dist/*.tar.gz )
          done
          ( cd /tmp/build-a/dist && sha256sum ./*.whl ./*.tar.gz ) | sed 's#\./##' | sort -k2 > /tmp/hash-a.txt
          ( cd /tmp/build-b/dist && sha256sum ./*.whl ./*.tar.gz ) | sed 's#\./##' | sort -k2 > /tmp/hash-b.txt
          echo "== build A ==" ; cat /tmp/hash-a.txt
          echo "== build B ==" ; cat /tmp/hash-b.txt
          if ! diff -q /tmp/hash-a.txt /tmp/hash-b.txt >/dev/null; then
            echo "::error::Non-deterministic build — refusing to release"; exit 1
          fi
          echo "Deterministic: build A == build B"
          cp -r /tmp/build-a/dist "$GITHUB_WORKSPACE/dist"

      - name: twine check
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Enforce metadata + archive contents
        run: python scripts/check_package.py dist

      - name: SHA-256 checksums (canonical, published with the release)
        run: cd dist && sha256sum *.whl *.tar.gz | tee SHA256SUMS.txt

      - name: Clean-environment install of the built wheel + smoke test
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install --upgrade pip
          /tmp/fresh/bin/python -m pip install dist/*.whl
          cp scripts/release_smoke.py /tmp/release_smoke.py
          cd /tmp && /tmp/fresh/bin/python /tmp/release_smoke.py

      - name: Upload the validated distribution (for the publish job)
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish to PyPI (protected, human-approved)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # protected env → requires manual approval
    permissions:
      id-token: write          # PyPI Trusted Publishing (OIDC), no API token
    steps:
      - name: Download the exact validated distribution (no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Publish to PyPI (Trusted Publishing)
        # Pinned to a full commit SHA (not the mutable release/v1 tag) so the
        # publishing step cannot change under us. SHA = pypa/gh-action-pypi-publish v1.14.1.
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          packages-dir: dist
          print-hash: true
