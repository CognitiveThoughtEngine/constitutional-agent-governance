name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/

      - name: Security scan (Bandit)
        run: |
          echo "== Bandit full report (all severities — informational) =="
          bandit -r src/constitutional_agent -f screen || true
          echo "== Bandit blocking gate (fails the build on MEDIUM+ severity) =="
          bandit -r src/constitutional_agent --severity-level medium

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=constitutional_agent --cov-fail-under=95
